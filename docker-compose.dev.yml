version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: pos-postgres
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: pos
    ports:
      - "5432:5432"
    volumes:
      - pos_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  turbo-runner:
    image: node:20-alpine
    working_dir: /repo
    volumes:
      - ./:/repo
    ports:
      - "3000:3000" # web
      - "3003:3003" # gateway
      - "3001:3001" # users
      - "3002:3002" # auth
    environment:
      # Evita picos de RAM
      NODE_OPTIONS: "--max-old-space-size=4096"
    depends_on:
      - postgres
      - redis
    command: >
      sh -lc "
        corepack enable &&
        pnpm install &&
        pnpm turbo run dev \
          --filter=web \
          --filter=api-gateway \
          --filter=auth-service \
          --filter=users-service \
          --concurrency=5
      "

volumes:
  pos_pgdata:
