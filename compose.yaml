services:
  postgres:
    image: postgres:16
    container_name: pos-postgres
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: pos
    ports:
      - "5432:5432"
    volumes:
      - pos_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: pos-redis
    ports:
      - "6379:6379"
    volumes:
      - pos_redis:/data

volumes:
  pos_pgdata:
  pos_redis:
